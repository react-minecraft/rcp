[versions]

paper-api = "1.18.2-R0.1-SNAPSHOT"

lombok = "1.18.48"

packetevents = "2.13.0"
flatbuffers = "25.2.10"

configurate = "4.2.0"
actions = "2.1.2"
schedula = "1.1.0"
textserializer = "1.0.0"

junit = "6.1.3"
junit-platform = "6.1.3"


[libraries]

paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }

lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

packetevents = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetevents" }
flatbuffers = { module = "com.google.flatbuffers:flatbuffers-java", version.ref = "flatbuffers" }

configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
actions = { module = "com.github.g4vrk:FunctionalActions", version.ref = "actions" }
schedula-common = { module = "com.github.g4vrk.Schedula:common", version.ref = "schedula" }
textserializer-legacy = { module = "com.github.g4vrk.TextSerializer:legacy", version.ref = "textserializer" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
