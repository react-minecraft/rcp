[versions]

cloud = "2.0.0"
adventure = "4.10.0"
slf4j = "1.7.36"

lombok = "1.18.48"

flatbuffers = "25.2.10"

configurate = "4.2.0"
actions = "2.2.1"
schedula = "2.0.1"
textserializer = "1.2.0"

junit = "6.1.3"
junit-platform = "6.1.3"


[libraries]

cloud-core = { module = "org.incendo:cloud-core", version.ref = "cloud" }
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

flatbuffers = { module = "com.google.flatbuffers:flatbuffers-java", version.ref = "flatbuffers" }

configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
actions = { module = "com.github.g4vrk:FunctionalActions", version.ref = "actions" }
schedula-common = { module = "com.github.g4vrk.Schedula:common", version.ref = "schedula" }
textserializer-legacy = { module = "com.github.g4vrk.TextSerializer:legacy", version.ref = "textserializer" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
